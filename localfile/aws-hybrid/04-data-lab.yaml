AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  RideNow hands-on lab - data layer (04-lab). Five single-AZ PostgreSQL
  instances (user/driver/trip/payment/notification), sized for learning
  (db.t4g.micro, 20 GiB, no Multi-AZ, no deletion protection). Simplified
  version of iac/stacks/04-data.yaml; exports use the same naming convention
  so manifests and guide 07 work unchanged. matching-service DB is omitted.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment tag applied to every resource.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class. t4g.micro is the cheapest option.

  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: Storage in GiB per instance (20 GiB gp3 is the minimum).

  EngineVersion:
    Type: String
    Default: "17"
    Description: >
      PostgreSQL major version. "17" lets RDS pick the latest available minor
      automatically - never pin a specific minor (e.g. "17.4") because AWS
      retires old minors and the stack will fail.

Resources:

  # ---- Shared subnet group (private subnets imported from network stack) ---
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "ridenow-${Environment} lab RDS private subnets"
      SubnetIds: !Split
        - ","
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-PrivateSubnetIds"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: lab

  # ---- 1. user-service DB --------------------------------------------------
  # Needed by: user-service (accounts), driver-service (cross-service user check)
  UserDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete       # lab: skip final snapshot on delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "ridenow-${Environment}-user-db"
      DBName: user_service
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      MasterUsername: app_user
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-DbSecurityGroupId"
      PubliclyAccessible: false
      BackupRetentionPeriod: 0   # lab: disable automated backups
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "ridenow-${Environment}-user-db"
        - Key: Service
          Value: user-service

  # ---- 2. driver-service DB ------------------------------------------------
  # Needed by: driver-service (drivers, vehicles, live state profile)
  # Demo pattern: driver-service calls user-service over HTTP before creating
  # a driver -> proves service-to-service communication with both DBs up.
  DriverDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "ridenow-${Environment}-driver-db"
      DBName: driver_service
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      MasterUsername: driver
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-DbSecurityGroupId"
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "ridenow-${Environment}-driver-db"
        - Key: Service
          Value: driver-service

  # ---- 3. trip-service DB --------------------------------------------------
  # Needed by: trip-service (ride lifecycle, concurrency lock)
  # Demo pattern: trip-service emits trip.completed / driver.accepted ->
  # EventBridge -> SQS -> notification-worker (proves pattern 2 + 3).
  TripDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "ridenow-${Environment}-trip-db"
      DBName: trip_service
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      MasterUsername: trip
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-DbSecurityGroupId"
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "ridenow-${Environment}-trip-db"
        - Key: Service
          Value: trip-service

  # ---- 4. payment-service DB -----------------------------------------------
  # Needed by: payment-service (idempotent charges)
  # Demo pattern: payment emits payment.succeeded/failed -> EventBridge ->
  # SQS -> notification-worker (same fan-out path as trip events).
  PaymentDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "ridenow-${Environment}-payment-db"
      DBName: payment_service
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      MasterUsername: payment
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-DbSecurityGroupId"
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "ridenow-${Environment}-payment-db"
        - Key: Service
          Value: payment-service

  # ---- 5. notification-worker DB -------------------------------------------
  # Needed by: notification-worker (processed_notifications idempotency ledger)
  # Demo pattern: worker must persist which events it has handled so a
  # duplicate SQS delivery is a no-op -> proves idempotent consumer pattern.
  NotificationDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "ridenow-${Environment}-notification-db"
      DBName: notification_service
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      MasterUsername: notification
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-DbSecurityGroupId"
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "ridenow-${Environment}-notification-db"
        - Key: Service
          Value: notification-worker

Outputs:
  # Export names match iac/stacks/04-data.yaml so downstream manifests and
  # the 07-eks-deploy.md guide work without any changes.

  UserDbEndpoint:
    Value: !GetAtt UserDb.Endpoint.Address
    Export:
      Name: !Sub "ridenow-${Environment}-data-UserDbEndpoint"
  UserDbSecretArn:
    Value: !GetAtt UserDb.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "ridenow-${Environment}-data-UserDbSecretArn"

  DriverDbEndpoint:
    Value: !GetAtt DriverDb.Endpoint.Address
    Export:
      Name: !Sub "ridenow-${Environment}-data-DriverDbEndpoint"
  DriverDbSecretArn:
    Value: !GetAtt DriverDb.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "ridenow-${Environment}-data-DriverDbSecretArn"

  TripDbEndpoint:
    Value: !GetAtt TripDb.Endpoint.Address
    Export:
      Name: !Sub "ridenow-${Environment}-data-TripDbEndpoint"
  TripDbSecretArn:
    Value: !GetAtt TripDb.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "ridenow-${Environment}-data-TripDbSecretArn"

  PaymentDbEndpoint:
    Value: !GetAtt PaymentDb.Endpoint.Address
    Export:
      Name: !Sub "ridenow-${Environment}-data-PaymentDbEndpoint"
  PaymentDbSecretArn:
    Value: !GetAtt PaymentDb.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "ridenow-${Environment}-data-PaymentDbSecretArn"

  NotificationDbEndpoint:
    Value: !GetAtt NotificationDb.Endpoint.Address
    Export:
      Name: !Sub "ridenow-${Environment}-data-NotificationDbEndpoint"
  NotificationDbSecretArn:
    Value: !GetAtt NotificationDb.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "ridenow-${Environment}-data-NotificationDbSecretArn"
