# RideNow - whole-system local stack (Stage 6).
#
# Brings up all four services AND their databases together on one network with
# ONE command, in the topology the cloud will mirror:
#   - each service reaches its OWN database by the DB's container name (not localhost)
#   - driver-service reaches user-service by its service name (http://user-service:8081),
#     which is exactly how Kubernetes Service DNS will resolve it later
#   - config is injected via environment variables (the local stand-in for
#     ConfigMap / Secret / AWS Secrets Manager); values come from .env with
#     safe defaults in .env.example
#
# Usage:
#   cp .env.example .env         # once; then edit if you like
#   docker compose up --build    # build images and start the whole system
#   docker compose ps            # see health
#   docker compose down          # stop (keep data)
#   docker compose down -v       # stop and wipe all data
#
# The per-service docker-compose.yml files still exist for running a single
# database in isolation; this root file is the full system.

services:
  # ---- Databases (one per service; database-per-service rule) ----------------
  user-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_service}
      POSTGRES_USER: ${USER_DB_USERNAME:-app_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_local}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USERNAME:-app_user} -d ${USER_DB_NAME:-user_service}"]
      interval: 5s
      timeout: 3s
      retries: 10

  driver-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DRIVER_DB_NAME:-driver_service}
      POSTGRES_USER: ${DRIVER_DB_USERNAME:-driver}
      POSTGRES_PASSWORD: ${DRIVER_DB_PASSWORD:-driver_local}
    volumes:
      - driver-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DRIVER_DB_USERNAME:-driver} -d ${DRIVER_DB_NAME:-driver_service}"]
      interval: 5s
      timeout: 3s
      retries: 10

  trip-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${TRIP_DB_NAME:-trip_service}
      POSTGRES_USER: ${TRIP_DB_USERNAME:-trip}
      POSTGRES_PASSWORD: ${TRIP_DB_PASSWORD:-trip_local}
    volumes:
      - trip-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRIP_DB_USERNAME:-trip} -d ${TRIP_DB_NAME:-trip_service}"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_service}
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:-payment}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_local}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USERNAME:-payment} -d ${PAYMENT_DB_NAME:-payment_service}"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_service}
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_local}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USERNAME:-notification} -d ${NOTIFICATION_DB_NAME:-notification_service}"]
      interval: 5s
      timeout: 3s
      retries: 10

  matching-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${MATCHING_DB_NAME:-matching_service}
      POSTGRES_USER: ${MATCHING_DB_USERNAME:-matching}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD:-matching_local}
    volumes:
      - matching-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MATCHING_DB_USERNAME:-matching} -d ${MATCHING_DB_NAME:-matching_service}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Valkey: live driver state, GEO matching, pub/sub, streams, cache -------
  # The local stand-in for Amazon ElastiCache for Valkey (Redis protocol, so the
  # Spring Data Redis client code and the REDIS_* env vars are unchanged; only
  # the host/port change in the cloud). The service is still named "redis" so
  # the REDIS_HOST=redis wiring below keeps working. It is the PRIMARY store for
  # live driver location/availability (the DBML keeps that out of Postgres), the
  # GEO index matching-service queries, the pub/sub channel for live tracking,
  # the driver-locations stream matching-service consumes, and a cache-aside
  # store for the driver profile.
  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Local AWS (LocalStack): SNS + SQS -------------------------------------
  # The local stand-in for AWS messaging. The init script under
  # localstack/init/ready.d provisions the same resource names the cloud uses
  # (see iac/stacks/05-messaging.yaml): the ridenow-local-events topic, three
  # consumer queues (matching, payment, notifications) each with a DLQ, and one
  # raw-delivery subscription per queue filtering on the event's "type".
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
      DEBUG: "0"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      # The init marker file is written by LocalStack once ready.d scripts ran.
      test: ["CMD-SHELL", "test \"$$(awslocal sns list-subscriptions --query 'length(Subscriptions)' --output text 2>/dev/null)\" = 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---- Application services --------------------------------------------------
  user-service:
    build: ./user-service
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME:-user_service}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-user_local}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  driver-service:
    build: ./driver-service
    depends_on:
      driver-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://driver-db:5432/${DRIVER_DB_NAME:-driver_service}
      SPRING_DATASOURCE_USERNAME: ${DRIVER_DB_USERNAME:-driver}
      SPRING_DATASOURCE_PASSWORD: ${DRIVER_DB_PASSWORD:-driver_local}
      # Service-to-service: reach user-service by its compose service name, the
      # local equivalent of Kubernetes Service DNS.
      SERVICES_USER_SERVICE_BASE_URL: http://user-service:8081
      # Valkey (Redis protocol): live driver state (primary store), the pub/sub
      # channel for live tracking, and the driver-locations stream matching-service
      # consumes (trimmed to about this many entries).
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RIDENOW_LOCATION_STREAM_MAX_LENGTH: 10000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  trip-service:
    build: ./trip-service
    depends_on:
      trip-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      # POST /trips authorizes the fare with payment-service synchronously.
      payment-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://trip-db:5432/${TRIP_DB_NAME:-trip_service}
      SPRING_DATASOURCE_USERNAME: ${TRIP_DB_USERNAME:-trip}
      SPRING_DATASOURCE_PASSWORD: ${TRIP_DB_PASSWORD:-trip_local}
      SERVICES_PAYMENT_SERVICE_BASE_URL: http://payment-service:8083
      # Async event publishing (SNS). The "sns" profile activates
      # the real SDK publisher; without it the logging publisher is used.
      SPRING_PROFILES_ACTIVE: sns
      RIDENOW_EVENTS_TOPIC_ARN: ${EVENTS_TOPIC_ARN:-arn:aws:sns:ap-southeast-1:000000000000:ridenow-local-events}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  payment-service:
    build: ./payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/${PAYMENT_DB_NAME:-payment_service}
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USERNAME:-payment}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_local}
      SPRING_PROFILES_ACTIVE: sns
      RIDENOW_EVENTS_TOPIC_ARN: ${EVENTS_TOPIC_ARN:-arn:aws:sns:ap-southeast-1:000000000000:ridenow-local-events}
      # Consumes trip.completed / trip.cancelled to capture / release the hold.
      RIDENOW_PAYMENT_QUEUE_URL: http://localstack:4566/000000000000/ridenow-local-payment
      # PayPal REST app credentials (sandbox first). Blank = PayPal not configured.
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---- Notification worker: SQS notifications queue -> inbox table + API -----
  notification-worker:
    build: ./notification-worker
    depends_on:
      notification-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      # Valkey holds the trip tracking pairing keys that realtime-gateway reads.
      # Notifications themselves go to the inbox table (GET /api/notifications).
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/${NOTIFICATION_DB_NAME:-notification_service}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USERNAME:-notification}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_local}
      RIDENOW_NOTIFICATIONS_QUEUE_URL: http://localstack:4566/000000000000/ridenow-local-notifications
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---- Matching service: nearby-driver matching via Redis GEO ----------------
  # Reads driver positions from the ridenow:stream:driver-locations stream through
  # the 'matching' consumer group (retained, retried, dead-lettered).
  matching-service:
    build: ./matching-service
    depends_on:
      matching-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://matching-db:5432/${MATCHING_DB_NAME:-matching_service}
      SPRING_DATASOURCE_USERNAME: ${MATCHING_DB_USERNAME:-matching}
      SPRING_DATASOURCE_PASSWORD: ${MATCHING_DB_PASSWORD:-matching_local}
      # Consumes trip.requested; publishes match.offered (sns profile).
      SPRING_PROFILES_ACTIVE: sns
      RIDENOW_MATCHING_QUEUE_URL: http://localstack:4566/000000000000/ridenow-local-matching
      RIDENOW_EVENTS_TOPIC_ARN: ${EVENTS_TOPIC_ARN:-arn:aws:sns:ap-southeast-1:000000000000:ridenow-local-events}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Use the Redis GEO finder in the running system (the "real" path).
      MATCHING_FINDER: redis
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---- Realtime gateway: SSE live driver location to the trip's passenger ------
  # Subscribes to the ridenow:driver:locations and ridenow:tracking:ended Pub/Sub
  # channels (the gateway needs every message on every pod; it does not use the stream).
  # Stream: curl -N "http://localhost:8086/live/trips/{tripId}/location?userId={passengerId}"
  realtime-gateway:
    build: ./realtime-gateway
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8086/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  user-db-data:
  driver-db-data:
  trip-db-data:
  payment-db-data:
  notification-db-data:
  matching-db-data:
