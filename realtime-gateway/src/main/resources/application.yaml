server:
  port: ${SERVER_PORT:8086}
  # On SIGTERM: stop taking new requests and give in-flight work time to finish.
  # The SSE streams are completed first (StreamRegistry); clients then reconnect.
  shutdown: graceful

spring:
  application:
    name: realtime-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Redis Pub/Sub carries driver positions and trip-ended signals to every gateway
  # pod, and the pairing keys live there too. Config-driven: a local redis container
  # or Amazon ElastiCache by env only.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ElastiCache is provisioned with in-transit TLS; set REDIS_SSL=true there.
      ssl:
        enabled: ${REDIS_SSL:false}

ridenow:
  gateway:
    locations-channel: ridenow:driver:locations
    ended-channel: ridenow:tracking:ended
    # Browser origins allowed to open a stream. "*" is for local use only; set the
    # real app origin(s) in the cloud. (Native mobile clients send no Origin.)
    allowed-origins: ${RIDENOW_GATEWAY_ALLOWED_ORIGINS:*}
    # A new stream beyond this evicts the trip's oldest one.
    max-streams-per-trip: 3
    # At most one location event per trip per interval.
    min-event-interval: 1s
    pairing-cache-ttl: 5s
    negative-cache-ttl: 1s
    # Server-side stream lifetime; the browser reconnects after it.
    stream-timeout: 30m
    # Base SSE retry: delay, jittered +/-50% per stream.
    retry: 3s
    # Interval of the ": ping" comment, in milliseconds.
    heartbeat-millis: 15000

# No database, no business API: the actuator health endpoint is for probes only.
# Split probes: readiness includes Redis (without it this pod cannot deliver, so
# stop routing new sockets to it); liveness does not (restarting would not fix a
# Redis outage, it would only drop every open socket).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
        liveness:
          include: livenessState
