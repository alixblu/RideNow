server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: payment-service

  # How this service reaches ITS OWN database. Values are env-overridable with
  # local defaults: bare `mvnw spring-boot:run` uses the defaults; Compose/EKS
  # inject SPRING_DATASOURCE_* so the same image runs anywhere. Host port 5436
  # matches the docker-compose.yml mapping for payment-db.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/payment_service}
    username: ${SPRING_DATASOURCE_USERNAME:payment}
    password: ${SPRING_DATASOURCE_PASSWORD:payment_local}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates that entities match it.
      ddl-auto: validate
    show-sql: false

# SQS consumer for trip.completed / trip.cancelled (capture / release the hold).
# The queue URL and AWS endpoint/region are injected by the environment
# (LocalStack locally; real AWS later - same code). Blank keeps the consumer off
# (plain unit test runs, or running payment-service without any AWS).
ridenow:
  payment:
    queue-url: ${RIDENOW_PAYMENT_QUEUE_URL:}
    poll:
      wait-seconds: 10
      max-messages: 10
  # PayPal REST app credentials (developer.paypal.com > Apps & Credentials). Blank
  # means PayPal is not configured and PAYPAL payments are declined. Never commit
  # real values; set them as environment variables / secrets.
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    # PayPal does not support VND: fares are converted at vnd-per-unit into currency.
    currency: ${PAYPAL_CURRENCY:USD}
    vnd-per-unit: ${PAYPAL_VND_PER_UNIT:25000}
    # Order amount multiplier so the hold covers a final fare above the estimate.
    authorization-buffer: ${PAYPAL_AUTHORIZATION_BUFFER:1.25}

# Actuator exposes /actuator/health so Compose and later Kubernetes can probe
# readiness/liveness without hitting business endpoints.
management:
  endpoints:
    web:
      exposure:
        include: health
