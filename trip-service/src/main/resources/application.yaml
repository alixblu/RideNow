server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: trip-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/trip_service}
    username: ${SPRING_DATASOURCE_USERNAME:trip}
    password: ${SPRING_DATASOURCE_PASSWORD:trip_local}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health