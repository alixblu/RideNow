server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: trip-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/trip_service}
    username: ${SPRING_DATASOURCE_USERNAME:trip}
    password: ${SPRING_DATASOURCE_PASSWORD:trip_local}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health

# Where trip-service reaches payment-service (sync authorize on POST /trips).
# Short timeouts: a hung payment-service must fail the request fast. Compose/EKS
# override the URL via SERVICES_PAYMENT_SERVICE_BASE_URL.
services:
  payment-service:
    base-url: ${SERVICES_PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
    connect-timeout: ${SERVICES_PAYMENT_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICES_PAYMENT_SERVICE_READ_TIMEOUT:3s}