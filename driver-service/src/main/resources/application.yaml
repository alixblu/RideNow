server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: driver-service

  # How this service reaches ITS OWN database.
  # Host port 5433 matches the docker-compose.yml port mapping for driver-db.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/driver_service}
    username: ${SPRING_DATASOURCE_USERNAME:driver}
    password: ${SPRING_DATASOURCE_PASSWORD:driver_local}

  jpa:
    hibernate:
      # validate = on startup, check that the entities match existing tables,
      # but do NOT create or change tables. We will create tables explicitly
      # (a migration tool comes in a later lesson). For this first run we switch
      # to "update" so Hibernate creates the tables from the entities, letting
      # you see data persist before we introduce proper migrations.
      ddl-auto: validate
    properties:
      hibernate:
        # Log the SQL Hibernate runs, formatted, so you can SEE what happens.
        format_sql: true
    show-sql: true

  # Redis-protocol connection (Spring Data Redis / Lettuce). Config-driven
  # host/port so the same code points at a local Valkey container or Amazon
  # ElastiCache for Valkey by env only. The cache is the PRIMARY store for live
  # driver location/availability - that state is deliberately NOT in Postgres
  # (see docs/database/ridenow.dbml).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ElastiCache is provisioned with in-transit TLS; set REDIS_SSL=true there.
      ssl:
        enabled: ${REDIS_SSL:false}

ridenow:
  live:
    location:
      # Every location update is also appended to the Redis stream
      # ridenow:stream:driver-locations that matching-service consumes. The stream
      # is trimmed approximately (MAXLEN ~) to this many entries: about 100-200 s at
      # 50-100 drivers posting once a second, enough to ride out a matching restart.
      stream-max-length: ${RIDENOW_LOCATION_STREAM_MAX_LENGTH:10000}

# Actuator exposes a /actuator/health endpoint so you (and later Kubernetes)
# can ask "is this service healthy?" without hitting business endpoints.
management:
  endpoints:
    web:
      exposure:
        include: health

# Where driver-service reaches user-service (Stage 4).
services:
  user-service:
    base-url: ${SERVICES_USER_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout: ${SERVICES_USER_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICES_USER_SERVICE_READ_TIMEOUT:3s}