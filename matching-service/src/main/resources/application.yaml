server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: matching-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/matching_service}
    username: ${SPRING_DATASOURCE_USERNAME:matching}
    password: ${SPRING_DATASOURCE_PASSWORD:matching_local}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  # Redis-protocol cache: the GEO finder (Task B4) and the driver-locations stream
  # this service consumes. Config-driven; the same code points at a local Valkey
  # container or Amazon ElastiCache for Valkey by env only.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ElastiCache is provisioned with in-transit TLS; set REDIS_SSL=true there.
      ssl:
        enabled: ${REDIS_SSL:false}

ridenow:
  matching:
    # Which nearby-driver finder to use: "postgres" (boring scan, default) or
    # "redis" (Redis GEO). Flip to feel the difference / move to the real path.
    finder: ${MATCHING_FINDER:postgres}
    # SQS consumer for trip.requested. The queue URL and AWS endpoint/region are
    # injected by the environment (LocalStack locally; real AWS later - same
    # code). Blank keeps the consumer off (plain test runs, or no AWS at all).
    queue-url: ${RIDENOW_MATCHING_QUEUE_URL:}
    poll:
      wait-seconds: 10
      max-messages: 10
    # Driver positions arrive on the Redis stream driver-service appends to, read
    # through a consumer group: every entry goes to one pod, is acknowledged after it
    # is applied, and is retried if the pod dies or the handler fails. Delivery is
    # at-least-once; the position service ignores duplicates and older reports.
    location-subscriber:
      enabled: ${RIDENOW_LOCATION_SUBSCRIBER_ENABLED:true}
      stream: ridenow:stream:driver-locations
      group: matching
      # Blank = the pod hostname (unique per pod on Kubernetes).
      consumer-name: ${RIDENOW_LOCATION_CONSUMER_NAME:}
      batch-size: 100
      block-timeout: 2s
      # A pending entry idle this long (pod died, handler failed) is taken over and
      # retried; the check runs every reclaim-interval.
      reclaim-idle: 30s
      reclaim-interval: 30s
      # After this many deliveries an entry is moved to the capped dead-letter stream.
      max-deliveries: 5
      dead-letter-stream: ridenow:stream:driver-locations-dlq
      dead-letter-max-length: 1000

management:
  endpoints:
    web:
      exposure:
        include: health
