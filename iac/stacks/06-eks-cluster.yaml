AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RideNow compute layer (06). EKS control plane with KMS secrets envelope
  encryption and AWS Fargate profiles (serverless pods) on the PRIVATE subnets -
  no EC2 node groups. OIDC is enabled so pods assume scoped IRSA roles (07). The
  cluster role and Fargate pod execution role come from the IAM stack (01);
  subnets come from the network stack (02).

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]

  KubernetesVersion:
    Type: String
    Default: "1.31"
    Description: EKS Kubernetes version.

Resources:
  # ---- KMS key for Kubernetes secrets envelope encryption ------------------
  ClusterKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "ridenow-${Environment} EKS secrets encryption key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "ridenow-${Environment}"
      Version: !Ref KubernetesVersion
      RoleArn: !ImportValue
        Fn::Sub: "ridenow-${Environment}-iam-ClusterRoleArn"
      ResourcesVpcConfig:
        # Control plane ENIs land in the private subnets; endpoint is reachable
        # both privately (pods) and publicly (kubectl from an operator laptop).
        SubnetIds: !Split
          - ","
          - !ImportValue
            Fn::Sub: "ridenow-${Environment}-network-PrivateSubnetIds"
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: "ridenow-${Environment}-network-NodeSecurityGroupId"
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      EncryptionConfig:
        - Provider:
            KeyArn: !GetAtt ClusterKmsKey.Arn
          Resources:
            - secrets
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---- Fargate profiles (serverless pods on private subnets) ---------------
  # Each profile matches pods by namespace and schedules them onto right-sized
  # Fargate micro-VMs. No EC2 nodes, no node SG for pods (Fargate pods attach to
  # the cluster security group), no autoscaler.

  # Application services (user/driver/trip/payment/matching/notification-worker).
  AppFargateProfile:
    Type: AWS::EKS::FargateProfile
    Properties:
      ClusterName: !Ref Cluster
      FargateProfileName: !Sub "ridenow-${Environment}-app"
      PodExecutionRoleArn: !ImportValue
        Fn::Sub: "ridenow-${Environment}-iam-FargatePodExecutionRoleArn"
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-PrivateSubnetIds"
      Selectors:
        - Namespace: ridenow

  # System add-ons: CoreDNS, AWS Load Balancer Controller, External Secrets,
  # metrics-server. CoreDNS must be patched to run on Fargate (see guide 05).
  SystemFargateProfile:
    Type: AWS::EKS::FargateProfile
    Properties:
      ClusterName: !Ref Cluster
      FargateProfileName: !Sub "ridenow-${Environment}-system"
      PodExecutionRoleArn: !ImportValue
        Fn::Sub: "ridenow-${Environment}-iam-FargatePodExecutionRoleArn"
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-PrivateSubnetIds"
      Selectors:
        - Namespace: kube-system
        - Namespace: external-secrets

  # Fargate log router config lives in the aws-observability namespace.
  ObservabilityFargateProfile:
    Type: AWS::EKS::FargateProfile
    Properties:
      ClusterName: !Ref Cluster
      FargateProfileName: !Sub "ridenow-${Environment}-observability"
      PodExecutionRoleArn: !ImportValue
        Fn::Sub: "ridenow-${Environment}-iam-FargatePodExecutionRoleArn"
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-PrivateSubnetIds"
      Selectors:
        - Namespace: aws-observability

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export:
      Name: !Sub "ridenow-${Environment}-eks-ClusterName"

  ClusterEndpoint:
    Value: !GetAtt Cluster.Endpoint
    Export:
      Name: !Sub "ridenow-${Environment}-eks-ClusterEndpoint"

  # Full OIDC issuer URL, e.g. https://oidc.eks.<region>.amazonaws.com/id/XXXX
  OidcIssuerUrl:
    Value: !GetAtt Cluster.OpenIdConnectIssuerUrl
    Export:
      Name: !Sub "ridenow-${Environment}-eks-OidcIssuerUrl"
