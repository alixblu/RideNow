AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RideNow messaging layer (05). An SNS topic that every service publishes domain
  events to, and one SQS work queue (+ dead-letter queue) per consumer, each fed
  by an SNS subscription with raw message delivery (the SQS body is the event JSON).
  Subscriptions filter on the event's top-level "type" field (FilterPolicyScope
  MessageBody), so each consumer receives only the event types it handles:
    matching queue      <- trip.requested                  (matching-service)
    payment queue       <- trip.completed, trip.cancelled  (payment-service)
    notifications queue <- every event, no filter          (notification-worker)
  Plus an ElastiCache for Valkey replication group (Redis protocol): driver GEO /
  live state, the location Pub/Sub channel and trip-ended signal for
  realtime-gateway, and the driver-locations stream matching-service consumes.
  Mirrors localstack/init/01-messaging.sh. Each capability is gated by a
  parameter so an environment can leave it off.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]

  EnableMessaging:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Create the SNS topic, subscriptions, and SQS queues.

  EnableRedis:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Create the ElastiCache for Valkey replication group.

  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: ElastiCache node type (sized per environment).

  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Deliveries before a message is moved to its dead-letter queue.

Conditions:
  MessagingOn: !Equals [!Ref EnableMessaging, "true"]
  RedisOn: !Equals [!Ref EnableRedis, "true"]

Resources:
  # ---- SNS: the one RideNow topic -------------------------------------------
  # No KmsMasterKeyId on purpose: a topic encrypted with the AWS-managed aws/sns
  # key cannot deliver to SQS subscriptions (that key's policy cannot be edited to
  # allow the SNS service principal's cross-service use). To encrypt the topic at
  # rest, use a customer-managed KMS key whose policy allows sns.amazonaws.com.
  TripEventTopic:
    Type: AWS::SNS::Topic
    Condition: MessagingOn
    Properties:
      TopicName: !Sub "ridenow-${Environment}-events"
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---- SQS: notifications queue + DLQ (notification-worker) -----------------
  # Logical ids and names unchanged from the single-queue version, so updating
  # an existing stack keeps this queue (and any messages in it) in place.
  NotificationDlq:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-notifications-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  NotificationQueue:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-notifications"
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDlq.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---- SQS: matching queue + DLQ (matching-service) -------------------------
  MatchingDlq:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-matching-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  MatchingQueue:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-matching"
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MatchingDlq.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---- SQS: payment queue + DLQ (payment-service) ---------------------------
  PaymentDlq:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-payment-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  PaymentQueue:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-payment"
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PaymentDlq.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---- SNS subscriptions: one per consumer, raw delivery, filtered by type ---
  # RawMessageDelivery: the SQS body is the event JSON itself (no SNS envelope).
  # FilterPolicyScope MessageBody: the policy matches the JSON body's top-level
  # "type" field, so publishers set no message attributes. The notifications
  # subscription has no policy and receives every event.
  MatchingSubscription:
    Type: AWS::SNS::Subscription
    Condition: MessagingOn
    Properties:
      TopicArn: !Ref TripEventTopic
      Protocol: sqs
      Endpoint: !GetAtt MatchingQueue.Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageBody
      FilterPolicy:
        type:
          - trip.requested

  PaymentSubscription:
    Type: AWS::SNS::Subscription
    Condition: MessagingOn
    Properties:
      TopicArn: !Ref TripEventTopic
      Protocol: sqs
      Endpoint: !GetAtt PaymentQueue.Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageBody
      FilterPolicy:
        type:
          - trip.completed
          - trip.cancelled

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: MessagingOn
    Properties:
      TopicArn: !Ref TripEventTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationQueue.Arn
      RawMessageDelivery: true

  # ---- Queue policies: only the RideNow topic may deliver to each queue -----
  # Scoped by aws:SourceArn to this topic, not to SNS at large.
  MatchingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: MessagingOn
    Properties:
      Queues:
        - !Ref MatchingQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRideNowTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt MatchingQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref TripEventTopic

  PaymentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: MessagingOn
    Properties:
      Queues:
        - !Ref PaymentQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRideNowTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PaymentQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref TripEventTopic

  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: MessagingOn
    Properties:
      Queues:
        - !Ref NotificationQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRideNowTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref TripEventTopic

  # ---- ElastiCache for Valkey (live state, GEO, Pub/Sub, driver-locations stream) ----
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Condition: RedisOn
    Properties:
      CacheSubnetGroupName: !Sub "ridenow-${Environment}-redis-subnets"
      Description: !Sub "ridenow-${Environment} Redis private subnets"
      SubnetIds: !Split
        - ","
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-PrivateSubnetIds"

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: RedisOn
    Properties:
      GroupDescription: !Sub "ridenow-${Environment} Redis (private)"
      VpcId: !ImportValue
        Fn::Sub: "ridenow-${Environment}-network-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "ridenow-${Environment}-network-NodeSecurityGroupId"
          Description: Redis 6379 from EKS nodes only.
      Tags:
        - Key: Name
          Value: !Sub "ridenow-${Environment}-redis-sg"

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Condition: RedisOn
    Properties:
      ReplicationGroupId: !Sub "ridenow-${Environment}-redis"
      ReplicationGroupDescription: !Sub "ridenow-${Environment} driver GEO / live state"
      # ElastiCache for Valkey (Redis protocol, ~20% cheaper than Redis OSS).
      # A major-only EngineVersion lets AWS pick the latest minor, like the
      # Postgres EngineVersion convention. Moving an existing group from redis
      # to valkey is an in-place migration and needs the explicit parameter
      # group below. Logical IDs and parameters keep the "Redis" name on purpose
      # (renaming them would replace the resource).
      Engine: valkey
      EngineVersion: "8.0"
      CacheParameterGroupName: default.valkey8
      CacheNodeType: !Ref RedisNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      AtRestEncryptionEnabled: true
      # In-transit TLS: clients (Redis protocol) must connect with SSL enabled
      # (REDIS_SSL=true / spring.data.redis.ssl.enabled).
      TransitEncryptionEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  TripEventTopicArn:
    Condition: MessagingOn
    Value: !Ref TripEventTopic
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-TripEventTopicArn"

  NotificationQueueUrl:
    Condition: MessagingOn
    Value: !Ref NotificationQueue
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-NotificationQueueUrl"

  NotificationQueueArn:
    Condition: MessagingOn
    Value: !GetAtt NotificationQueue.Arn
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-NotificationQueueArn"

  MatchingQueueUrl:
    Condition: MessagingOn
    Value: !Ref MatchingQueue
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-MatchingQueueUrl"

  MatchingQueueArn:
    Condition: MessagingOn
    Value: !GetAtt MatchingQueue.Arn
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-MatchingQueueArn"

  PaymentQueueUrl:
    Condition: MessagingOn
    Value: !Ref PaymentQueue
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-PaymentQueueUrl"

  PaymentQueueArn:
    Condition: MessagingOn
    Value: !GetAtt PaymentQueue.Arn
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-PaymentQueueArn"

  RedisPrimaryEndpoint:
    Condition: RedisOn
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-RedisPrimaryEndpoint"

  # Stack 07 opens this group to the Fargate pods (the cluster security group).
  RedisSecurityGroupId:
    Condition: RedisOn
    Value: !Ref RedisSecurityGroup
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-RedisSecurityGroupId"
