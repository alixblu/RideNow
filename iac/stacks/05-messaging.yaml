AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RideNow messaging layer (05). An EventBridge custom bus that every service
  publishes domain events to, and one SQS work queue (+ dead-letter queue) per
  consumer, each fed by an EventBridge rule that matches only the event types
  that consumer handles (detail-type routing):
    matching queue      <- trip.requested                  (matching-service)
    payment queue       <- trip.completed, trip.cancelled  (payment-service)
    notifications queue <- every ridenow.* event           (notification-worker)
  Plus an ElastiCache Redis replication group (driver GEO / live state, and the
  Pub/Sub channel notification-worker uses to reach realtime-gateway).
  Mirrors localstack/init/01-messaging.sh. Each capability is gated by a
  parameter so an environment can leave it off.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]

  EnableMessaging:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Create the EventBridge bus, rules, and SQS queues.

  EnableRedis:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Create the ElastiCache Redis replication group.

  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: ElastiCache node type (sized per environment).

  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Deliveries before a message is moved to its dead-letter queue.

Conditions:
  MessagingOn: !Equals [!Ref EnableMessaging, "true"]
  RedisOn: !Equals [!Ref EnableRedis, "true"]

Resources:
  # ---- EventBridge: the one RideNow bus -------------------------------------
  TripEventBus:
    Type: AWS::Events::EventBus
    Condition: MessagingOn
    Properties:
      Name: !Sub "ridenow-${Environment}-events"

  # ---- SQS: notifications queue + DLQ (notification-worker) -----------------
  # Logical ids and names unchanged from the single-queue version, so updating
  # an existing stack keeps this queue (and any messages in it) in place.
  NotificationDlq:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-notifications-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  NotificationQueue:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-notifications"
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDlq.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---- SQS: matching queue + DLQ (matching-service) -------------------------
  MatchingDlq:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-matching-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  MatchingQueue:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-matching"
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MatchingDlq.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---- SQS: payment queue + DLQ (payment-service) ---------------------------
  PaymentDlq:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-payment-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  PaymentQueue:
    Type: AWS::SQS::Queue
    Condition: MessagingOn
    Properties:
      QueueName: !Sub "ridenow-${Environment}-payment"
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PaymentDlq.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ---- EventBridge rules: one per consumer, routed by detail-type -----------
  TripRequestedRule:
    Type: AWS::Events::Rule
    Condition: MessagingOn
    Properties:
      Name: !Sub "ridenow-${Environment}-trip-requested"
      Description: trip.requested -> matching queue
      EventBusName: !Ref TripEventBus
      State: ENABLED
      EventPattern:
        source:
          - prefix: "ridenow."
        detail-type:
          - trip.requested
      Targets:
        - Id: matching-queue
          Arn: !GetAtt MatchingQueue.Arn

  TripEndedRule:
    Type: AWS::Events::Rule
    Condition: MessagingOn
    Properties:
      Name: !Sub "ridenow-${Environment}-trip-ended"
      Description: trip.completed / trip.cancelled -> payment queue (capture / release)
      EventBusName: !Ref TripEventBus
      State: ENABLED
      EventPattern:
        source:
          - prefix: "ridenow."
        detail-type:
          - trip.completed
          - trip.cancelled
      Targets:
        - Id: payment-queue
          Arn: !GetAtt PaymentQueue.Arn

  AllEventsRule:
    Type: AWS::Events::Rule
    Condition: MessagingOn
    Properties:
      Name: !Sub "ridenow-${Environment}-all-events"
      Description: every RideNow event -> notifications queue
      EventBusName: !Ref TripEventBus
      State: ENABLED
      EventPattern:
        source:
          - prefix: "ridenow."
      Targets:
        - Id: notifications-queue
          Arn: !GetAtt NotificationQueue.Arn

  # ---- Queue policies: only the matching rule may deliver to each queue -----
  # Scoped by aws:SourceArn to the specific rule, not to EventBridge at large.
  MatchingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: MessagingOn
    Properties:
      Queues:
        - !Ref MatchingQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTripRequestedRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt MatchingQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt TripRequestedRule.Arn

  PaymentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: MessagingOn
    Properties:
      Queues:
        - !Ref PaymentQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTripEndedRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PaymentQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt TripEndedRule.Arn

  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: MessagingOn
    Properties:
      Queues:
        - !Ref NotificationQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAllEventsRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt AllEventsRule.Arn

  # ---- ElastiCache Redis (driver GEO / live state, notification Pub/Sub) ----
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Condition: RedisOn
    Properties:
      CacheSubnetGroupName: !Sub "ridenow-${Environment}-redis-subnets"
      Description: !Sub "ridenow-${Environment} Redis private subnets"
      SubnetIds: !Split
        - ","
        - !ImportValue
          Fn::Sub: "ridenow-${Environment}-network-PrivateSubnetIds"

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: RedisOn
    Properties:
      GroupDescription: !Sub "ridenow-${Environment} Redis (private)"
      VpcId: !ImportValue
        Fn::Sub: "ridenow-${Environment}-network-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "ridenow-${Environment}-network-NodeSecurityGroupId"
          Description: Redis 6379 from EKS nodes only.
      Tags:
        - Key: Name
          Value: !Sub "ridenow-${Environment}-redis-sg"

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Condition: RedisOn
    Properties:
      ReplicationGroupId: !Sub "ridenow-${Environment}-redis"
      ReplicationGroupDescription: !Sub "ridenow-${Environment} driver GEO / live state"
      Engine: redis
      CacheNodeType: !Ref RedisNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      AtRestEncryptionEnabled: true
      # In-transit TLS: Redis clients must connect with SSL enabled
      # (REDIS_SSL=true / spring.data.redis.ssl.enabled).
      TransitEncryptionEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  TripEventBusName:
    Condition: MessagingOn
    Value: !Ref TripEventBus
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-TripEventBusName"

  TripEventBusArn:
    Condition: MessagingOn
    Value: !GetAtt TripEventBus.Arn
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-TripEventBusArn"

  NotificationQueueUrl:
    Condition: MessagingOn
    Value: !Ref NotificationQueue
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-NotificationQueueUrl"

  NotificationQueueArn:
    Condition: MessagingOn
    Value: !GetAtt NotificationQueue.Arn
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-NotificationQueueArn"

  MatchingQueueUrl:
    Condition: MessagingOn
    Value: !Ref MatchingQueue
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-MatchingQueueUrl"

  MatchingQueueArn:
    Condition: MessagingOn
    Value: !GetAtt MatchingQueue.Arn
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-MatchingQueueArn"

  PaymentQueueUrl:
    Condition: MessagingOn
    Value: !Ref PaymentQueue
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-PaymentQueueUrl"

  PaymentQueueArn:
    Condition: MessagingOn
    Value: !GetAtt PaymentQueue.Arn
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-PaymentQueueArn"

  RedisPrimaryEndpoint:
    Condition: RedisOn
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub "ridenow-${Environment}-messaging-RedisPrimaryEndpoint"
