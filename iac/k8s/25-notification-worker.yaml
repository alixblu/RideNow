# notification-worker: ServiceAccount + Deployment + Service.
#
# Serves the notification inbox at /api/notifications (routed by 30-ingress.yaml),
# read by frontend polling.
#
# It consumes the SQS notifications queue, so it needs the queue URL and AWS
# region, plus permission to read SQS. Permission comes via IRSA: the service
# account below is annotated with an IAM role ARN that grants SQS access (no
# static keys). It writes each notification to its inbox table, and keeps the
# trip tracking pairing keys in Redis that realtime-gateway reads.
#
# Placeholders: <ACCOUNT_ID> <REGION> <IMAGE_TAG> <NOTIFICATION_DB_ENDPOINT> <APP_ORIGIN>
#               <NOTIFICATIONS_QUEUE_URL> <NOTIFICATION_WORKER_ROLE_ARN>
#               <REDIS_ENDPOINT>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-worker
  namespace: ridenow
  annotations:
    # IRSA: stack 07's NotificationWorkerRoleArn export - receive/delete/
    # attributes on the notifications queue only.
    eks.amazonaws.com/role-arn: "<NOTIFICATION_WORKER_ROLE_ARN>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: ridenow
  labels:
    app: notification-worker
spec:
  # A single consumer is fine; the queue decouples throughput. Scale up only if
  # the backlog grows (SQS supports multiple competing consumers).
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      serviceAccountName: notification-worker
      containers:
        - name: notification-worker
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/notification-worker:<IMAGE_TAG>
          ports:
            - containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<NOTIFICATION_DB_ENDPOINT>:5432/notification_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-db-credentials
                  key: password
            # SQS consumer config. With IRSA, no static AWS keys are needed -
            # the default credentials chain uses the service account's role.
            - name: RIDENOW_NOTIFICATIONS_QUEUE_URL
              value: "<NOTIFICATIONS_QUEUE_URL>"
            - name: AWS_REGION
              value: "<REGION>"
            # Trip tracking pairing keys for realtime-gateway (ElastiCache,
            # in-transit TLS).
            - name: REDIS_HOST
              value: "<REDIS_ENDPOINT>"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_SSL
              value: "true"
            # Browser origin(s) of the app allowed to call /api/**. Never "*" here.
            - name: RIDENOW_CORS_ALLOWED_ORIGINS
              value: "<APP_ORIGIN>"
            # OpenTelemetry Java agent -> ADOT Collector -> X-Ray (xray-tracing spec).
            # The agent jar is baked into the image at /opt/otel; it is attached only here,
            # so docker-compose runs the same image without it. Memory overhead: the agent
            # adds roughly 100-200 MB heap/metaspace and slower startup; the 512Mi/1Gi
            # resources and the 5 min startupProbe below are kept. Raise memory only if a
            # rollout shows OOMKilled. No headers or bodies are captured.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: "notification-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://adot-collector.ridenow.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_PROPAGATORS
              value: "xray,tracecontext,baggage"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # Poll loops (@Scheduled) must not each start a trace.
            - name: OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED
              value: "false"
            # JDBC statements are recorded without parameter values.
            - name: OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED
              value: "true"
            # Keep the service map readable: no method-level spans for Spring Data
            # repositories, Hibernate transactions or @Scheduled tasks. JDBC spans stay.
            - name: OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_HIBERNATE_ENABLED
              value: "false"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=<ENV>"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Holds off the liveness probe until the app has started (JVM start on a
          # 0.25 vCPU Fargate pod takes 70-110 s). Allows up to 5 minutes.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-worker
  namespace: ridenow
spec:
  selector:
    app: notification-worker
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP
