# payment-service: ServiceAccount + Deployment + Service + HPA.
#
# Authorizes fares synchronously (POST /api/payments, called by trip-service),
# captures / releases them asynchronously from the payment SQS queue
# (trip.completed / trip.cancelled), and publishes payment events to the bus.
# AWS access via IRSA (no static keys): the role is stack 07's
# PaymentServiceRoleArn export.
#
# Placeholders: <ACCOUNT_ID> <REGION> <IMAGE_TAG> <ENV> <PAYMENT_DB_ENDPOINT>
#               <PAYMENT_QUEUE_URL> <PAYMENT_SERVICE_ROLE_ARN>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: ridenow
  annotations:
    eks.amazonaws.com/role-arn: "<PAYMENT_SERVICE_ROLE_ARN>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ridenow
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      serviceAccountName: payment-service
      containers:
        - name: payment-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/payment-service:<IMAGE_TAG>
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<PAYMENT_DB_ENDPOINT>:5432/payment_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-credentials
                  key: password
            # Publish payment events; consume the payment queue (capture/release).
            - name: SPRING_PROFILES_ACTIVE
              value: "eventbridge"
            - name: RIDENOW_EVENTS_BUS_NAME
              value: "ridenow-<ENV>-events"
            - name: RIDENOW_PAYMENT_QUEUE_URL
              value: "<PAYMENT_QUEUE_URL>"
            - name: AWS_REGION
              value: "<REGION>"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ridenow
spec:
  selector:
    app: payment-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  namespace: ridenow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
