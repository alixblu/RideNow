# Ingress: one internet-facing ALB fronting the four public APIs and the
# realtime-gateway WebSocket endpoint (/ws) by path.
#
# Requires the AWS Load Balancer Controller installed in the cluster and using
# the AlbControllerRoleArn exported by stack 07-eks-addons. The controller reads
# these annotations and provisions an ALB in the PUBLIC subnets (discovered via
# the kubernetes.io/role/elb subnet tags set in the network stack).
#
# target-type: ip is REQUIRED on Fargate - there are no EC2 instances to register
# as targets, so the ALB targets pod IPs directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ridenow
  namespace: ridenow
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # WebSockets (/ws) are long-lived. The ALB closes a connection after this
    # many idle seconds; the gateway's 10s STOMP heartbeats keep live sockets
    # busy, and the raised limit gives headroom over the 60s default for clients
    # on slow networks whose heartbeats arrive late.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8081
          - path: /api/drivers
            pathType: Prefix
            backend:
              service:
                name: driver-service
                port:
                  number: 8080
          - path: /api/trips
            pathType: Prefix
            backend:
              service:
                name: trip-service
                port:
                  number: 8082
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8083
          # WebSocket (STOMP) endpoint for live notifications. The ALB upgrades
          # HTTP to WebSocket natively; no extra annotation is needed.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: realtime-gateway
                port:
                  number: 8086
          # matching-service is internal (ClusterIP), reached in-cluster by other
          # services - not exposed publicly by default. Uncomment to make its API
          # reachable through the ALB (e.g. for testing the match endpoint).
          # - path: /api/matching
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: matching-service
          #       port:
          #         number: 8085
