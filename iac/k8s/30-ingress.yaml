# Ingress: one internet-facing ALB fronting the public APIs, the notification
# inbox (/api/notifications) and the realtime-gateway SSE stream (/live) by path.
#
# Requires the AWS Load Balancer Controller installed in the cluster and using
# the AlbControllerRoleArn exported by stack 07-eks-addons. The controller reads
# these annotations and provisions an ALB in the PUBLIC subnets (discovered via
# the kubernetes.io/role/elb subnet tags set in the network stack).
#
# target-type: ip is REQUIRED on Fargate - there are no EC2 instances to register
# as targets, so the ALB targets pod IPs directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ridenow
  namespace: ridenow
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # SSE streams (/live) are long-lived. The ALB closes a connection after this
    # many idle seconds; the gateway's ": ping" every 15s keeps live streams
    # busy, and the raised limit gives headroom over the 60s default for clients
    # on slow networks.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8081
          - path: /api/drivers
            pathType: Prefix
            backend:
              service:
                name: driver-service
                port:
                  number: 8080
          # GET /api/vehicles/{id} is served by driver-service too.
          - path: /api/vehicles
            pathType: Prefix
            backend:
              service:
                name: driver-service
                port:
                  number: 8080
          # Prefix matching is per path segment, so /api/trips does NOT cover
          # /api/trip-offers: it needs its own rule.
          - path: /api/trip-offers
            pathType: Prefix
            backend:
              service:
                name: trip-service
                port:
                  number: 8082
          - path: /api/trips
            pathType: Prefix
            backend:
              service:
                name: trip-service
                port:
                  number: 8082
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8083
          # Notification inbox, read by frontend polling.
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-worker
                port:
                  number: 8084
          # SSE stream of the driver's live position for the trip's passenger.
          # Plain HTTP; the ALB needs no extra annotation.
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: realtime-gateway
                port:
                  number: 8086
          # matching-service is internal (ClusterIP), reached in-cluster by other
          # services - not exposed publicly by default. Uncomment to make its API
          # reachable through the ALB (e.g. for testing the match endpoint).
          # - path: /api/matching
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: matching-service
          #       port:
          #         number: 8085
