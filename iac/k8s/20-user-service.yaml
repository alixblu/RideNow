# user-service: Deployment + Service + HPA.
#
# Image, DB endpoint, and <ENV>/<ACCOUNT_ID>/<REGION> placeholders are templated
# by CI (or sed) from the ECR (03) and data (04) stack exports. The container
# reads SPRING_DATASOURCE_* and SERVER_PORT from the environment exactly as its
# application.yaml defines - one image, env supplies the difference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ridenow
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/user-service:<IMAGE_TAG>
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<USER_DB_ENDPOINT>:5432/user_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-credentials
                  key: password
            # Browser origin(s) of the app allowed to call /api/**. Never "*" here.
            - name: RIDENOW_CORS_ALLOWED_ORIGINS
              value: "<APP_ORIGIN>"
            # OpenTelemetry Java agent -> ADOT Collector -> X-Ray (xray-tracing spec).
            # The agent jar is baked into the image at /opt/otel; it is attached only here,
            # so docker-compose runs the same image without it. Memory overhead: the agent
            # adds roughly 100-200 MB heap/metaspace and slower startup; the 512Mi/1Gi
            # resources and the 5 min startupProbe below are kept. Raise memory only if a
            # rollout shows OOMKilled. No headers or bodies are captured.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: "user-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://adot-collector.ridenow.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_PROPAGATORS
              value: "xray,tracecontext,baggage"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # JDBC statements are recorded without parameter values.
            - name: OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED
              value: "true"
            # Keep the service map readable: no method-level spans for Spring Data
            # repositories, Hibernate transactions or @Scheduled tasks. JDBC spans stay.
            - name: OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_HIBERNATE_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED
              value: "false"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=<ENV>"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Holds off the liveness probe until the app has started (JVM start on a
          # 0.25 vCPU Fargate pod takes 70-110 s). Allows up to 5 minutes.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ridenow
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service
  namespace: ridenow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
