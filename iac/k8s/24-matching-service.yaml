# matching-service: Deployment + Service + HPA.
#
# Internal service (ClusterIP): other services reach it in-cluster; it is not
# exposed through the Ingress by default. It owns the Redis GEO index used to
# answer "nearby drivers" and reads driver positions from the driver-locations
# stream (consumer group "matching"), so it needs the Valkey (ElastiCache) endpoint. Until
# that endpoint exists, matching cannot answer GEO queries (expected).
#
# Matching is triggered asynchronously: it consumes trip.requested from the
# matching SQS queue and publishes match.offered to the topic. AWS access via
# IRSA (no static keys): the role is stack 07's MatchingServiceRoleArn export.
#
# Placeholders templated from the ECR (03), data (04), messaging (05) and EKS
# add-on (07) stacks:
#   <ACCOUNT_ID> <REGION> <IMAGE_TAG> <ENV> <MATCHING_DB_ENDPOINT> <REDIS_ENDPOINT>
#   <MATCHING_QUEUE_URL> <MATCHING_SERVICE_ROLE_ARN>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: matching-service
  namespace: ridenow
  annotations:
    eks.amazonaws.com/role-arn: "<MATCHING_SERVICE_ROLE_ARN>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: ridenow
  labels:
    app: matching-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      serviceAccountName: matching-service
      containers:
        - name: matching-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/matching-service:<IMAGE_TAG>
          ports:
            - containerPort: 8085
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<MATCHING_DB_ENDPOINT>:5432/matching_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: matching-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matching-db-credentials
                  key: password
            # Redis GEO index and the driver-locations stream (Valkey on ElastiCache).
            # matching-service owns the index and reads the stream as group "matching";
            # the consumer name defaults to the pod hostname.
            - name: REDIS_HOST
              value: "<REDIS_ENDPOINT>"
            - name: REDIS_PORT
              value: "6379"
            # ElastiCache has in-transit TLS on.
            - name: REDIS_SSL
              value: "true"
            # Use the Redis GEO finder (the real path) rather than the Postgres scan.
            - name: MATCHING_FINDER
              value: "redis"
            # Consume trip.requested; publish match.offered.
            - name: SPRING_PROFILES_ACTIVE
              value: "sns"
            - name: RIDENOW_MATCHING_QUEUE_URL
              value: "<MATCHING_QUEUE_URL>"
            - name: RIDENOW_EVENTS_TOPIC_ARN
              value: "arn:aws:sns:<REGION>:<ACCOUNT_ID>:ridenow-<ENV>-events"
            - name: AWS_REGION
              value: "<REGION>"
            # OpenTelemetry Java agent -> ADOT Collector -> X-Ray (xray-tracing spec).
            # The agent jar is baked into the image at /opt/otel; it is attached only here,
            # so docker-compose runs the same image without it. Memory overhead: the agent
            # adds roughly 100-200 MB heap/metaspace and slower startup; the 512Mi/1Gi
            # resources and the 5 min startupProbe below are kept. Raise memory only if a
            # rollout shows OOMKilled. No headers or bodies are captured.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: "matching-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://adot-collector.ridenow.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_PROPAGATORS
              value: "xray,tracecontext,baggage"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # Poll loops (@Scheduled) must not each start a trace.
            - name: OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED
              value: "false"
            # JDBC statements are recorded without parameter values.
            - name: OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED
              value: "true"
            # Keep the service map readable: no method-level spans for Spring Data
            # repositories, Hibernate transactions or @Scheduled tasks. JDBC spans stay.
            - name: OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_HIBERNATE_ENABLED
              value: "false"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=<ENV>"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Holds off the liveness probe until the app has started (JVM start on a
          # 0.25 vCPU Fargate pod takes 70-110 s). Allows up to 5 minutes.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: ridenow
spec:
  selector:
    app: matching-service
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matching-service
  namespace: ridenow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matching-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
