# matching-service: Deployment + Service + HPA.
#
# Internal service (ClusterIP): other services reach it in-cluster; it is not
# exposed through the Ingress by default. It owns the Redis GEO index used to
# answer "nearby drivers", so it needs the Redis (ElastiCache) endpoint. Until
# that endpoint exists, matching cannot answer GEO queries (expected).
#
# Placeholders templated from the ECR (03), data (04), and ElastiCache endpoints:
#   <ACCOUNT_ID> <REGION> <IMAGE_TAG> <MATCHING_DB_ENDPOINT> <REDIS_ENDPOINT>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: ridenow
  labels:
    app: matching-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      containers:
        - name: matching-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/matching-service:<IMAGE_TAG>
          ports:
            - containerPort: 8085
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<MATCHING_DB_ENDPOINT>:5432/matching_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: matching-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matching-db-credentials
                  key: password
            # Redis GEO index (ElastiCache). matching-service owns this index.
            - name: REDIS_HOST
              value: "<REDIS_ENDPOINT>"
            - name: REDIS_PORT
              value: "6379"
            # Use the Redis GEO finder (the real path) rather than the Postgres scan.
            - name: MATCHING_FINDER
              value: "redis"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: ridenow
spec:
  selector:
    app: matching-service
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matching-service
  namespace: ridenow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matching-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
