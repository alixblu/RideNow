# trip-service: ServiceAccount + Deployment + Service + HPA.
#
# Publishes trip events to the EventBridge bus (eventbridge profile) and calls
# payment-service synchronously to authorize the fare on POST /trips.
# AWS access via IRSA (no static keys): the role is stack 07's
# TripServiceRoleArn export.
#
# Placeholders: <ACCOUNT_ID> <REGION> <IMAGE_TAG> <ENV> <TRIP_DB_ENDPOINT>
#               <TRIP_SERVICE_ROLE_ARN>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trip-service
  namespace: ridenow
  annotations:
    eks.amazonaws.com/role-arn: "<TRIP_SERVICE_ROLE_ARN>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: ridenow
  labels:
    app: trip-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      serviceAccountName: trip-service
      containers:
        - name: trip-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/trip-service:<IMAGE_TAG>
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<TRIP_DB_ENDPOINT>:5432/trip_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trip-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trip-db-credentials
                  key: password
            # Sync authorize call (strict: no hold, no trip). In-cluster DNS.
            - name: SERVICES_PAYMENT_SERVICE_BASE_URL
              value: "http://payment-service:8083"
            # Async: publish trip events to the bus. IRSA supplies credentials.
            - name: SPRING_PROFILES_ACTIVE
              value: "eventbridge"
            - name: RIDENOW_EVENTS_BUS_NAME
              value: "ridenow-<ENV>-events"
            - name: AWS_REGION
              value: "<REGION>"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: ridenow
spec:
  selector:
    app: trip-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trip-service
  namespace: ridenow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trip-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
