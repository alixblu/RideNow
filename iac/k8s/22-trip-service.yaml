# trip-service: ServiceAccount + Deployment + Service + HPA.
#
# Publishes trip events to the SNS topic (sns profile) and calls
# payment-service synchronously to authorize the fare on POST /trips.
# AWS access via IRSA (no static keys): the role is stack 07's
# TripServiceRoleArn export.
#
# Placeholders: <ACCOUNT_ID> <REGION> <IMAGE_TAG> <ENV> <TRIP_DB_ENDPOINT> <APP_ORIGIN>
#               <TRIP_SERVICE_ROLE_ARN>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trip-service
  namespace: ridenow
  annotations:
    eks.amazonaws.com/role-arn: "<TRIP_SERVICE_ROLE_ARN>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: ridenow
  labels:
    app: trip-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      serviceAccountName: trip-service
      containers:
        - name: trip-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/trip-service:<IMAGE_TAG>
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<TRIP_DB_ENDPOINT>:5432/trip_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trip-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trip-db-credentials
                  key: password
            # Sync authorize call (strict: no hold, no trip). In-cluster DNS.
            - name: SERVICES_PAYMENT_SERVICE_BASE_URL
              value: "http://payment-service:8083"
            # Async: publish trip events to the topic. IRSA supplies credentials.
            - name: SPRING_PROFILES_ACTIVE
              value: "sns"
            - name: RIDENOW_EVENTS_TOPIC_ARN
              value: "arn:aws:sns:<REGION>:<ACCOUNT_ID>:ridenow-<ENV>-events"
            - name: AWS_REGION
              value: "<REGION>"
            # Browser origin(s) of the app allowed to call /api/**. Never "*" here.
            - name: RIDENOW_CORS_ALLOWED_ORIGINS
              value: "<APP_ORIGIN>"
            # OpenTelemetry Java agent -> ADOT Collector -> X-Ray (xray-tracing spec).
            # The agent jar is baked into the image at /opt/otel; it is attached only here,
            # so docker-compose runs the same image without it. Memory overhead: the agent
            # adds roughly 100-200 MB heap/metaspace and slower startup; the 512Mi/1Gi
            # resources and the 5 min startupProbe below are kept. Raise memory only if a
            # rollout shows OOMKilled. No headers or bodies are captured.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: "trip-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://adot-collector.ridenow.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_PROPAGATORS
              value: "xray,tracecontext,baggage"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # JDBC statements are recorded without parameter values.
            - name: OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED
              value: "true"
            # Keep the service map readable: no method-level spans for Spring Data
            # repositories, Hibernate transactions or @Scheduled tasks. JDBC spans stay.
            - name: OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_HIBERNATE_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED
              value: "false"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=<ENV>"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Holds off the liveness probe until the app has started (JVM start on a
          # 0.25 vCPU Fargate pod takes 70-110 s). Allows up to 5 minutes.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: ridenow
spec:
  selector:
    app: trip-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trip-service
  namespace: ridenow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trip-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
