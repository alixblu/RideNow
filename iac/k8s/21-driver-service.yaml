# driver-service: Deployment + Service + HPA.
#
# Reaches user-service in-cluster by Kubernetes Service DNS
# (http://user-service:8081) - the cloud equivalent of the compose service name
# used locally. DB creds come from the driver-db Secret projected by
# external-secrets. Valkey (ElastiCache, Redis protocol) holds live location/availability, so the
# <REDIS_ENDPOINT> placeholder is templated from the messaging stack (05).
#
# Runs on AWS Fargate (scheduled by the `ridenow` namespace Fargate profile).
# Fargate sizes each pod's micro-VM by ROUNDING UP the sum of container
# requests to the nearest valid vCPU/memory combo - here requests 250m CPU /
# 512Mi round up to a 0.25 vCPU / 0.5 GB Fargate task. Keep requests realistic:
# you are billed for the rounded-up size, not actual usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
  namespace: ridenow
  labels:
    app: driver-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driver-service
  template:
    metadata:
      labels:
        app: driver-service
    spec:
      containers:
        - name: driver-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/driver-service:<IMAGE_TAG>
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<DRIVER_DB_ENDPOINT>:5432/driver_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: driver-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: driver-db-credentials
                  key: password
            # Service-to-service: in-cluster DNS, same shape as compose.
            - name: SERVICES_USER_SERVICE_BASE_URL
              value: "http://user-service:8081"
            # Live driver state, location Pub/Sub, the driver-locations stream and the
            # profile cache live in Valkey (ElastiCache, Redis protocol, in-transit TLS).
            - name: REDIS_HOST
              value: "<REDIS_ENDPOINT>"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_SSL
              value: "true"
            # The driver-locations stream (read by matching-service) is trimmed to about
            # this many entries: roughly 100-200 s at 50-100 drivers posting once a second.
            - name: RIDENOW_LOCATION_STREAM_MAX_LENGTH
              value: "10000"
            # Browser origin(s) of the app allowed to call /api/**. Never "*" here.
            - name: RIDENOW_CORS_ALLOWED_ORIGINS
              value: "<APP_ORIGIN>"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Holds off the liveness probe until the app has started (JVM start on a
          # 0.25 vCPU Fargate pod takes 70-110 s). Allows up to 5 minutes.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: ridenow
spec:
  selector:
    app: driver-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: driver-service
  namespace: ridenow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: driver-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
