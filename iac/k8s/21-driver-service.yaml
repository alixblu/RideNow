# driver-service: Deployment + Service + HPA.
#
# Reaches user-service in-cluster by Kubernetes Service DNS
# (http://user-service:8081) - the cloud equivalent of the compose service name
# used locally. DB creds come from the driver-db Secret projected by
# external-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
  namespace: ridenow
  labels:
    app: driver-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driver-service
  template:
    metadata:
      labels:
        app: driver-service
    spec:
      containers:
        - name: driver-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/ridenow/driver-service:<IMAGE_TAG>
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://<DRIVER_DB_ENDPOINT>:5432/driver_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: driver-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: driver-db-credentials
                  key: password
            # Service-to-service: in-cluster DNS, same shape as compose.
            - name: SERVICES_USER_SERVICE_BASE_URL
              value: "http://user-service:8081"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: ridenow
spec:
  selector:
    app: driver-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: driver-service
  namespace: ridenow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: driver-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
