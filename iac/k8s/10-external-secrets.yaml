# External Secrets wiring: pull each service's RDS master credentials from AWS
# Secrets Manager into a Kubernetes Secret that the Deployment consumes.
#
# PREREQUISITES (installed into the cluster once, outside these manifests):
#   - External Secrets Operator (helm install external-secrets ...)
#   - A service account in namespace `external-secrets` annotated with the
#     ExternalSecretsRoleArn exported by stack 07-eks-addons.
#
# Each RDS "ManageMasterUserPassword" secret is JSON: {"username":...,"password":...}.
# The services read SPRING_DATASOURCE_USERNAME / _PASSWORD / _URL from the
# environment (see each service's application.yaml), so we project the secret
# keys to exactly those env var names and build the URL from the DB endpoint.
#
# Replace <ACCOUNT_ID>, <REGION>, and the endpoint hosts with the values the
# data stack (04) exports for your environment, or template them in CI.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: ridenow-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: <REGION>
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-db-credentials
  namespace: ridenow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ridenow-secrets
    kind: ClusterSecretStore
  target:
    name: user-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: ridenow-<ENV>-user-db   # resolved via the secret ARN from stack 04
        property: username
    - secretKey: password
      remoteRef:
        key: ridenow-<ENV>-user-db
        property: password
---
