# External Secrets wiring: pull each service's RDS master credentials from AWS
# Secrets Manager into a Kubernetes Secret that the Deployment consumes.
#
# PREREQUISITES (installed into the cluster once, outside these manifests):
#   - External Secrets Operator (helm install external-secrets ...)
#   - A service account in namespace `external-secrets` annotated with the
#     ExternalSecretsRoleArn exported by stack 07-eks-addons.
#
# When RDS uses ManageMasterUserPassword: true it auto-generates the secret name
# (e.g. "ridenow-dev-user-db-AbCdEf"). The reliable reference is the secret ARN,
# exported by stack 04-data as ridenow-<ENV>-data-<Service>DbSecretArn.
# Substitute <USER_SECRET_ARN>, <DRIVER_SECRET_ARN>, <TRIP_SECRET_ARN>,
# <PAYMENT_SECRET_ARN> with the values from:
#
#   aws cloudformation list-exports --region ap-southeast-1 \
#     --query "Exports[?starts_with(Name,'ridenow-dev-data-')].{Name:Name,Value:Value}" \
#     --output table --no-cli-pager
#
# Replace <REGION> with ap-southeast-1.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ridenow-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: <REGION>
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-db-credentials
  namespace: ridenow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ridenow-secrets
    kind: ClusterSecretStore
  target:
    name: user-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: <USER_SECRET_ARN>
        property: username
    - secretKey: password
      remoteRef:
        key: <USER_SECRET_ARN>
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: driver-db-credentials
  namespace: ridenow
spec:
  refreshInterval: 1h
  secretStoreRef:
